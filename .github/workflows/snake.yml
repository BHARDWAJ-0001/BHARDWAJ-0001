
name: Generate Neon Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Neon Snake
        uses: Platane/snk@v3
        with:
          github_user_name: BHARDWAJ-0001
          outputs: |
            dist/neon-snake.gif?color_snake=%2300E5FF&color_dots=%23070B16,%230B1D3A,%23005B96,%2300AEEF,%237B2CFF&color_background=%23070B16

      - name: Publish Animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
