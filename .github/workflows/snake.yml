
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate light neon snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: BHARDWAJ-0001
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300D9FF&color_dots=%23071426%2C%230A3154%2C%23075B9A%2C%23008FCC%2C%2300D9FF

      - name: Generate dark neon snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: BHARDWAJ-0001
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300D9FF&color_dots=%23071426%2C%230A3154%2C%23075B9A%2C%23008FCC%2C%2300D9FF

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
