
name: Generate Cyberpunk Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Neon Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: BHARDWAJ-0001
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300D9FF&color_dots=%23050B16,%23082B57,%23075B9A,%2300AEEF,%2300D9FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2342D7FF&color_dots=%23050B16,%23082B57,%23075B9A,%2300AEEF,%2342D7FF

      - name: Publish Animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
